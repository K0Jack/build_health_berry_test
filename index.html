<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="healthberry_webpage">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>healthberry_webpage</title>
  <link rel="manifest" href="manifest.json">

  <!-- Simple debug logging -->
  <script>
    console.log('Flutter web app loading...');
    
    // Basic error handling
    window.addEventListener('error', function(e) {
      console.error('Global error:', e.error);
    });
    
    // CORS bypass for development (only for our API)
    window.addEventListener('DOMContentLoaded', function() {
      console.log('Setting up CORS bypass for API calls...');
      
      // Override fetch to add CORS headers only for our API
      const originalFetch = window.fetch;
      window.fetch = function(url, options = {}) {
        // Only apply CORS bypass to our API endpoints
        if (typeof url === 'string' && url.includes('47k7tdx24l.execute-api.eu-north-1.amazonaws.com')) {
          console.log('Intercepted API fetch request:', url);
          
          // Add CORS headers for API calls
          options.mode = 'cors';
          options.credentials = 'omit';
          
          if (!options.headers) {
            options.headers = {};
          }
          
          // Add standard headers for API
          options.headers['Access-Control-Allow-Origin'] = '*';
          options.headers['Access-Control-Allow-Methods'] = 'GET, POST, PUT, DELETE, OPTIONS';
          options.headers['Access-Control-Allow-Headers'] = 'Content-Type, Authorization, X-User-ID, X-User-Email, X-Admin-Role';
          
          console.log('Modified API fetch options:', options);
        }
        
        return originalFetch(url, options);
      };
    });
  </script>
</head>
<body>
  <!-- This script loads the main.dart.js file and initializes Flutter -->
  <script src="main.dart.js" type="application/javascript"></script>
  
  <!-- Simple loading indicator -->
  <div id="loading" style="
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: Arial, sans-serif;
    font-size: 18px;
    color: #333;
    z-index: 9999;
  ">
    Loading Flutter app...
  </div>
  
  <script>
    // Hide loading indicator after a reasonable timeout
    setTimeout(function() {
      const loading = document.getElementById('loading');
      if (loading) {
        loading.style.display = 'none';
        console.log('Loading indicator hidden');
      }
    }, 5000);
    
    // Also hide when Flutter is ready (if available)
    if (window.flutter_inappwebview) {
      window.addEventListener('flutter-first-frame', function() {
        const loading = document.getElementById('loading');
        if (loading) {
          loading.style.display = 'none';
          console.log('Flutter app loaded successfully!');
        }
      });
    }
  </script>
</body>
</html>
